<svg xmlns="http://www.w3.org/2000/svg" width="600" height="330" viewBox="0 0 600 330" role="img" aria-label="Pirâmide etária de São Luís: projeção 2022 a 2025 com dados do IBGE e DATASUS">
  <rect x="1" y="1" width="598" height="328" rx="10" fill="#1A0F26" stroke="#3A2350" stroke-width="2"/>
  <rect x="1" y="1" width="6" height="328" rx="3" fill="#C084FC"/>

  <!-- seta -->
  <path d="M556 30 L568 18 M559 18 L568 18 L568 27" stroke="#C084FC" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- rótulo -->
  <text x="34" y="38" font-family="Fira Code, Consolas, monospace" font-size="12" letter-spacing="2.5" fill="#C084FC">PROJETO REAL · DADOS PÚBLICOS</text>

  <!-- título -->
  <text x="34" y="76" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#F8F0FF">Pirâmide etária de São Luís</text>

  <!-- descrição -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#CBB8E0">
    <text x="34" y="110">Projeção da população para 2025 com o Censo 2022,</text>
    <text x="34" y="132">coletado pela API do IBGE, e os nascimentos e</text>
    <text x="34" y="154">óbitos de 2022 a 2025 do DATASUS.</text>
  </g>

  <!-- divisória -->
  <line x1="34" y1="224" x2="566" y2="224" stroke="#3A2350" stroke-width="1.5"/>

  <!-- resultado -->
  <text x="34" y="256" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#F8F0FF">Nascimentos −13% em 3 anos · população envelhecendo</text>

  <!-- tags -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E9D5FF" text-anchor="middle">
    <rect x="34"  y="276" width="78" height="28" rx="14" fill="none" stroke="#C084FC" stroke-width="1.5"/><text x="73"  y="295">Python</text>
    <rect x="122" y="276" width="78" height="28" rx="14" fill="none" stroke="#C084FC" stroke-width="1.5"/><text x="161" y="295">Pandas</text>
    <rect x="210" y="276" width="96" height="28" rx="14" fill="none" stroke="#C084FC" stroke-width="1.5"/><text x="258" y="295">API IBGE</text>
    <rect x="316" y="276" width="96" height="28" rx="14" fill="none" stroke="#C084FC" stroke-width="1.5"/><text x="364" y="295">DATASUS</text>
  </g>
</svg>
