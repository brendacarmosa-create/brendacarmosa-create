<svg xmlns="http://www.w3.org/2000/svg" width="600" height="230" viewBox="0 0 600 230" role="img" aria-label="Projeção da pirâmide etária de São Luís">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A0F26"/>
      <stop offset="1" stop-color="#24143A"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="598" height="228" rx="16" fill="url(#bg)" stroke="#3A2350" stroke-width="2"/>

  <!-- selo -->
  <rect x="28" y="24" width="138" height="26" rx="13" fill="#C084FC" fill-opacity="0.18" stroke="#C084FC" stroke-width="1"/>
  <text x="97" y="42" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#E9D5FF">DADOS REAIS</text>

  <!-- título -->
  <text x="28" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#F8F0FF">Pirâmide etária de São Luís</text>
  <text x="28" y="112" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#CBB8E0">Projeção 2022 → 2025 com IBGE e DATASUS</text>

  <!-- destaques -->
  <text x="28" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E9D5FF">• Censo 2022 via API do IBGE</text>
  <text x="28" y="171" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#E9D5FF">• Nascimentos −13% em 3 anos</text>

  <!-- tags -->
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0E0716">
    <rect x="28" y="188" width="64" height="22" rx="11" fill="#C084FC"/><text x="60" y="203" text-anchor="middle">Python</text>
    <rect x="100" y="188" width="64" height="22" rx="11" fill="#C084FC"/><text x="132" y="203" text-anchor="middle">Pandas</text>
    <rect x="172" y="188" width="50" height="22" rx="11" fill="#C084FC"/><text x="197" y="203" text-anchor="middle">API</text>
  </g>

  <!-- mini pirâmide -->
  <g transform="translate(470,40)">
    <line x1="50" y1="0" x2="50" y2="150" stroke="#CBB8E0" stroke-width="1"/>
    <rect x="44" y="0"   width="6"  height="12" fill="#7C5CC4"/><rect x="50" y="0"   width="9"  height="12" fill="#C084FC"/>
    <rect x="36" y="15"  width="14" height="12" fill="#7C5CC4"/><rect x="50" y="15"  width="18" height="12" fill="#C084FC"/>
    <rect x="26" y="30"  width="24" height="12" fill="#7C5CC4"/><rect x="50" y="30"  width="29" height="12" fill="#C084FC"/>
    <rect x="16" y="45"  width="34" height="12" fill="#7C5CC4"/><rect x="50" y="45"  width="39" height="12" fill="#C084FC"/>
    <rect x="8"  y="60"  width="42" height="12" fill="#7C5CC4"/><rect x="50" y="60"  width="46" height="12" fill="#C084FC"/>
    <rect x="4"  y="75"  width="46" height="12" fill="#7C5CC4"/><rect x="50" y="75"  width="48" height="12" fill="#C084FC"/>
    <rect x="2"  y="90"  width="48" height="12" fill="#7C5CC4"/><rect x="50" y="90"  width="48" height="12" fill="#C084FC"/>
    <rect x="8"  y="105" width="42" height="12" fill="#7C5CC4"/><rect x="50" y="105" width="41" height="12" fill="#C084FC"/>
    <rect x="12" y="120" width="38" height="12" fill="#7C5CC4"/><rect x="50" y="120" width="37" height="12" fill="#C084FC"/>
    <rect x="16" y="135" width="34" height="12" fill="#7C5CC4"/><rect x="50" y="135" width="33" height="12" fill="#C084FC"/>
  </g>
</svg>
